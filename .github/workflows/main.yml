name: Build IR NDA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        run: |
          FILE=$(find . -maxdepth 1 -type f -name '*.bin' | head -n 1)
          test -n "$FILE"
          mkdir -p project
          unzip -q "$FILE" -d project
          test -f project/IR_NDA_APP_BY_PRATIK/settings.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Build APK
        working-directory: project/IR_NDA_APP_BY_PRATIK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IR-NDA-APP-v1.0-BETA
          path: project/IR_NDA_APP_BY_PRATIK/app/build/outputs/apk/debug/app-debug.apk
