name: Build IR NDA APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        shell: bash
        run: |
          echo "Files in repository:"
          find . -maxdepth 2 -type f -print

          FILE=$(find . -type f -name '*.bin' -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: No .bin source file found."
            exit 1
          fi

          echo "Found source archive: $FILE"

          mkdir -p project

          echo "Testing archive..."
          unzip -t "$FILE"

          echo "Extracting archive..."
          unzip -q "$FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f -print

          test -f project/IR_NDA_APP_BY_PRATIK/settings.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Build APK
        working-directory: project/IR_NDA_APP_BY_PRATIK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IR-NDA-APP-v1.1.0
          path: project/IR_NDA_APP_BY_PRATIK/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.${{ github.run_number }}"
          gh release create "$TAG" \
            "project/IR_NDA_APP_BY_PRATIK/app/build/outputs/apk/debug/app-debug.apk" \
            --title "IR NDA APP by PRATIK $TAG" \
            --notes "IR NDA APP by PRATIK — v1.1.0 Beta"
